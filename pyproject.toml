[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leaddesk-ai"
version = "1.1.0"
description = "A white-label website FAQ and lead-capture assistant for local service businesses."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.100,<3.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[project.scripts]
leaddesk = "leaddesk.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/leaddesk"]

[tool.hatch.build.targets.wheel.force-include]
"data/business.json" = "leaddesk/defaults/business.json"
"data/knowledge_base.json" = "leaddesk/defaults/knowledge_base.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
