<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>BrightHome Assistant</title>
  <style>
    :root{--ink:#163a34;--muted:#657873;--cream:#f7f3ec;--orange:#f4a261;--line:#dfe7e2;--white:#fff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.shell{position:absolute;right:0;bottom:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none}.launcher{pointer-events:auto;width:64px;height:64px;border:0;border-radius:22px;background:var(--ink);color:white;box-shadow:0 12px 35px rgba(22,58,52,.3);display:grid;place-items:center;cursor:pointer;transition:.2s}.launcher:hover{transform:translateY(-3px)}.launcher svg{width:27px}.panel{pointer-events:auto;width:100%;height:100%;min-width:0;background:white;border:1px solid rgba(22,58,52,.1);border-radius:22px;box-shadow:0 30px 80px rgba(22,58,52,.22);display:none;overflow:hidden;grid-template-rows:auto minmax(0,1fr) auto}.shell.open .launcher{display:none}.shell.open .panel{display:grid}.header{min-width:0;background:var(--ink);color:white;padding:18px 18px 16px;display:flex;align-items:center;gap:12px}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:15px;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-weight:900;font-family:Georgia,serif;font-size:20px}.head-copy{min-width:0;flex:1}.head-copy strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:11px;color:#d3e3de;display:flex;align-items:center;gap:6px;margin-top:3px}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#8cd49b;box-shadow:0 0 0 3px rgba(140,212,155,.16)}.head-action{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:11px;background:rgba(255,255,255,.1);color:white;cursor:pointer;display:grid;place-items:center}.messages{min-width:0;overflow-y:auto;padding:18px;background:linear-gradient(#fff,#fdfcf9);scroll-behavior:smooth}.message{display:flex;min-width:0;margin-bottom:13px}.message>div{min-width:0;max-width:100%}.message.user{justify-content:flex-end}.bubble{max-width:88%;overflow-wrap:anywhere;padding:11px 13px;border-radius:8px 17px 17px 17px;background:var(--cream);font-size:13px;line-height:1.48;white-space:pre-wrap}.user .bubble{margin-left:auto;background:var(--ink);color:white;border-radius:17px 8px 17px 17px}.sources{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.sources a{font-size:10px;text-decoration:none;color:var(--ink);background:white;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.quick{display:flex;min-width:0;max-width:100%;gap:7px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none;background:#fdfcf9}.quick button{border:1px solid var(--line);background:white;color:var(--ink);white-space:nowrap;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer}.quote-prompt{margin:0 18px 13px;padding:12px;background:#fff4e7;border:1px solid #f5d3ad;border-radius:14px;display:none;align-items:center;gap:10px}.quote-prompt.show{display:flex}.quote-prompt span{font-size:11px;line-height:1.35;flex:1}.quote-prompt button,.quote-link{border:0;background:var(--orange);color:var(--ink);padding:8px 10px;border-radius:9px;font-size:11px;font-weight:850;cursor:pointer}.composer-wrap{min-width:0;border-top:1px solid var(--line);background:white}.composer{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:8px;padding:12px}.composer input{border:1px solid var(--line);border-radius:13px;padding:0 13px;height:42px;min-width:0;outline:none;font-size:13px}.composer input:focus{border-color:#7f9d95;box-shadow:0 0 0 3px rgba(22,58,52,.08)}.send{border:0;border-radius:13px;background:var(--ink);color:white;cursor:pointer}.send:disabled{opacity:.5}.privacy{font-size:9px;color:#86948f;padding:0 13px 10px;text-align:center}.lead-sheet{display:none;position:absolute;inset:0;z-index:5;background:white;overflow-y:auto}.lead-sheet.show{display:block}.sheet-head{position:sticky;top:0;background:var(--ink);color:white;padding:18px;display:flex;align-items:center;gap:12px;z-index:2}.sheet-head button{border:0;background:rgba(255,255,255,.1);color:white;width:34px;height:34px;border-radius:11px;cursor:pointer}.sheet-head div{flex:1}.sheet-head strong{font-size:15px}.sheet-head small{display:block;color:#c9d9d4;margin-top:3px}.lead-form{padding:20px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;color:var(--ink);outline:none;background:white;font-size:13px}.field textarea{min-height:70px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.consent{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:10px;line-height:1.4;color:var(--muted)}.consent input{margin:2px 0}.submit{width:100%;border:0;border-radius:13px;background:var(--orange);color:var(--ink);font-weight:900;padding:12px;cursor:pointer;margin-top:15px}.form-error{color:#a43e28;font-size:11px;min-height:16px;margin-top:8px}.success{padding:70px 28px;text-align:center}.success-mark{margin:auto;width:64px;height:64px;border-radius:22px;background:#dff0e2;display:grid;place-items:center;font-size:28px}.success h2{font-family:Georgia,serif;font-size:27px;margin:20px 0 10px}.success p{font-size:13px;line-height:1.55;color:var(--muted)}.typing .bubble:after{content:"•••";letter-spacing:3px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}@media(max-width:450px){.panel{border-radius:0}.row{grid-template-columns:1fr}.shell:not(.open){padding:8px}.shell.open{inset:0}}body.inline .shell{inset:0}body.inline .panel{border-radius:17px;box-shadow:none}body.inline .head-action.close{display:none}
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <button class="launcher" id="launcher" aria-label="Open chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-8 8H6l-4 2 1.4-4.2A9 9 0 1 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-linecap="round"/></svg></button>
    <section class="panel" aria-label="Chat with BrightHome">
      <header class="header"><div class="avatar">S</div><div class="head-copy"><strong><span id="assistantName">Sunny</span> · <span id="businessName">BrightHome</span></strong><span class="status">Ready to help</span></div><button class="head-action quote" id="headerQuote" aria-label="Request a quote">$</button><button class="head-action close" id="close" aria-label="Close chat">×</button></header>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="composer-wrap"><div class="quick" id="quick"></div><div class="quote-prompt" id="quotePrompt"><span>Want exact pricing for your home?</span><button id="quotePromptButton">Get quote</button></div><form class="composer" id="composer"><input id="question" maxlength="500" autocomplete="off" placeholder="Ask about services, pricing…" aria-label="Your question"><button class="send" id="send" aria-label="Send message">➜</button></form><div class="privacy">Answers use approved business information. Please don't share sensitive details.</div></div>
      <section class="lead-sheet" id="leadSheet"><header class="sheet-head"><button id="back" aria-label="Back to chat">←</button><div><strong>Request a free quote</strong><small>No commitment. The team will confirm details.</small></div></header><form class="lead-form" id="leadForm"><div class="row"><div class="field"><label for="name">Name *</label><input id="name" name="name" required maxlength="100"></div><div class="field"><label for="postal">Postal code</label><input id="postal" name="postal_code" maxlength="20"></div></div><div class="row"><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="200"></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" maxlength="40"></div></div><div class="field"><label for="service">Service *</label><select id="service" name="service" required><option value="">Choose a service</option><option>Standard cleaning</option><option>Deep cleaning</option><option>Move-in / move-out cleaning</option><option>Not sure yet</option></select></div><div class="row"><div class="field"><label for="size">Home size</label><select id="size" name="property_size"><option value="">Select</option><option>Studio / 1 bedroom</option><option>2 bedrooms</option><option>3 bedrooms</option><option>4+ bedrooms</option></select></div><div class="field"><label for="date">Preferred date</label><input id="date" name="preferred_date" type="date"></div></div><div class="field"><label for="message">Anything else?</label><textarea id="message" name="message" maxlength="1000" placeholder="Pets, add-ons, access notes…"></textarea></div><label class="consent"><input id="consent" name="consent" type="checkbox" required><span id="privacyNotice">I agree that BrightHome may use these details to contact me about this request.</span></label><button class="submit" id="submitLead">Send my request</button><div class="form-error" id="formError" role="alert"></div></form><div class="success" id="success" hidden><div class="success-mark">✓</div><h2>You're on the list.</h2><p id="successMessage">The team will follow up shortly.</p><button class="quote-link" id="done">Back to chat</button></div></section>
    </section>
  </div>
  <script>
    const $=id=>document.getElementById(id);const inline=new URLSearchParams(location.search).get('mode')==='inline';const shell=$('shell');if(inline){document.body.classList.add('inline');shell.classList.add('open')}const sessionId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).slice(0,80);let config={};
    function notify(expanded){if(!inline)parent.postMessage({type:'leaddesk:resize',expanded},'*')}
    function openChat(){shell.classList.add('open');notify(true);setTimeout(()=>$('question').focus(),150)}function closeChat(){shell.classList.remove('open');notify(false)}
    $('launcher').onclick=openChat;$('close').onclick=closeChat;
    function addMessage(text,type='bot',sources=[]){const wrap=document.createElement('div');wrap.className='message '+(type==='user'?'user':'');const inner=document.createElement('div');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;inner.appendChild(bubble);if(sources.length){const sourceWrap=document.createElement('div');sourceWrap.className='sources';sources.forEach(source=>{const a=document.createElement('a');a.textContent=source.title;a.href=source.url||'#';a.target='_blank';a.rel='noopener';sourceWrap.appendChild(a)});inner.appendChild(sourceWrap)}wrap.appendChild(inner);$('messages').appendChild(wrap);$('messages').scrollTop=$('messages').scrollHeight;return wrap}
    async function loadConfig(){try{const response=await fetch('/api/config');config=await response.json();const b=config.business;$('assistantName').textContent=b.assistant_name;$('businessName').textContent=b.name;$('privacyNotice').textContent=b.privacy_notice||`I agree that ${b.name} may contact me about this request.`;addMessage(`Hi! I'm ${b.assistant_name}, ${b.name}'s website assistant. Ask me about services, pricing, availability, or request a quote.`);b.quick_questions.forEach(text=>{const button=document.createElement('button');button.textContent=text;button.onclick=()=>ask(text);$('quick').appendChild(button)})}catch{addMessage('Hi! Ask me a question or use the quote form and the team will follow up.')}}
    async function ask(text){text=(text||'').trim();if(text.length<2)return;addMessage(text,'user');$('question').value='';$('send').disabled=true;const typing=addMessage('','bot');typing.classList.add('typing');try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,session_id:sessionId})});const data=await response.json();typing.remove();if(!response.ok)throw new Error(data.detail||'Unable to answer');addMessage(data.answer,'bot',data.sources||[]);$('quotePrompt').classList.toggle('show',Boolean(data.show_lead_form))}catch(error){typing.remove();addMessage(error.message||'Something went wrong. Please try again.')}finally{$('send').disabled=false}}
    $('composer').onsubmit=e=>{e.preventDefault();ask($('question').value)};function showForm(){shell.classList.add('open');$('leadSheet').classList.add('show');notify(true)}function hideForm(){$('leadSheet').classList.remove('show')}$('headerQuote').onclick=showForm;$('quotePromptButton').onclick=showForm;$('back').onclick=hideForm;$('done').onclick=()=>{hideForm();$('leadForm').hidden=false;$('success').hidden=true};window.addEventListener('message',event=>{if(event.data?.type==='leaddesk:show-lead')showForm()});
    $('leadForm').onsubmit=async e=>{e.preventDefault();const leadForm=e.currentTarget;$('formError').textContent='';const form=new FormData(leadForm);const payload=Object.fromEntries(form.entries());payload.consent=$('consent').checked;payload.source_page=(document.referrer||'website-widget').slice(0,250);$('submitLead').disabled=true;$('submitLead').textContent='Sending…';try{const response=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok){const detail=Array.isArray(data.detail)?data.detail[0]?.msg:data.detail;throw new Error(detail||'Please check your details.')}leadForm.hidden=true;$('success').hidden=false;$('successMessage').textContent=data.message;addMessage('Your quote request was sent. The team will follow up using the contact details you provided.')}catch(error){$('formError').textContent=error.message}finally{$('submitLead').disabled=false;$('submitLead').textContent='Send my request'}};
    loadConfig();
  </script>
</body>
</html>
